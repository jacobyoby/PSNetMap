<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2D7600"/>
    </marker>
    <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0B7285"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="none" stroke="#808080" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- Subnet container -->
  <rect x="20" y="20" width="920" height="400" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="40" y="50" font-size="15" font-weight="bold" fill="#333333">Main Network &#183; 192.168.1.0/24</text>
  <line x1="20" y1="62" x2="940" y2="62" stroke="#666666" stroke-width="1"/>

  <!-- Router (reachable, green) -->
  <g>
    <rect x="60" y="90" width="180" height="120" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <circle cx="150" cy="128" r="20" fill="none" stroke="#3d6b35" stroke-width="2.5"/>
    <path d="M150,112 L150,144 M134,128 L166,128 M139,117 L150,112 L161,117 M139,139 L150,144 L161,139 M117,128 L134,128 M166,128 L183,128" stroke="#3d6b35" stroke-width="2" fill="none"/>
    <text x="150" y="172" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">my-router</text>
    <text x="150" y="190" font-size="12" text-anchor="middle" fill="#555555">192.168.1.1</text>
  </g>

  <!-- Switch (reachable, green) -->
  <g>
    <rect x="390" y="90" width="180" height="120" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <rect x="425" y="112" width="110" height="26" rx="3" fill="none" stroke="#3d6b35" stroke-width="2.5"/>
    <path d="M435,138 L435,148 M455,138 L455,148 M475,138 L475,148 M495,138 L495,148 M515,138 L515,148" stroke="#3d6b35" stroke-width="2"/>
    <path d="M435,148 l6,0 M455,148 l6,0 M475,148 l6,0 M495,148 l6,0 M515,148 l6,0" stroke="#3d6b35" stroke-width="2"/>
    <text x="480" y="172" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">my-switch</text>
    <text x="480" y="190" font-size="12" text-anchor="middle" fill="#555555">192.168.1.10</text>
  </g>

  <!-- Server (unknown, gray) -->
  <g>
    <rect x="720" y="90" width="180" height="120" rx="6" fill="#eeeeee" stroke="#666666" stroke-width="2"/>
    <rect x="758" y="108" width="64" height="40" rx="3" fill="none" stroke="#555555" stroke-width="2.5"/>
    <line x1="758" y1="121" x2="822" y2="121" stroke="#555555" stroke-width="1.5"/>
    <line x1="758" y1="134" x2="822" y2="134" stroke="#555555" stroke-width="1.5"/>
    <circle cx="766" cy="114.5" r="2" fill="#555555"/>
    <text x="810" y="172" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">my-server</text>
    <text x="810" y="190" font-size="12" text-anchor="middle" fill="#555555">192.168.1.100</text>
  </g>

  <!-- Workstation (unreachable, red) -->
  <g>
    <rect x="390" y="260" width="180" height="120" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
    <rect x="448" y="282" width="64" height="42" rx="2" fill="none" stroke="#7d2a28" stroke-width="2.5"/>
    <line x1="448" y1="332" x2="512" y2="332" stroke="#7d2a28" stroke-width="2.5"/>
    <line x1="472" y1="332" x2="466" y2="340" stroke="#7d2a28" stroke-width="2.5"/>
    <line x1="488" y1="332" x2="494" y2="340" stroke="#7d2a28" stroke-width="2.5"/>
    <text x="480" y="356" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">my-workstation</text>
    <text x="480" y="372" font-size="12" text-anchor="middle" fill="#555555">192.168.1.200</text>
  </g>

  <!-- Edges -->
  <line x1="240" y1="150" x2="382" y2="150" stroke="#2D7600" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="311" y="140" font-size="11" text-anchor="middle" fill="#2D7600">L2-SNMP</text>

  <line x1="810" y1="210" x2="810" y2="252" stroke="#0B7285" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <line x1="810" y1="252" x2="560" y2="280" stroke="#0B7285" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="712" y="252" font-size="11" text-anchor="middle" fill="#0B7285">L2-FDB</text>

  <line x1="480" y1="210" x2="480" y2="252" stroke="#808080" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arr-gray)"/>
  <text x="540" y="240" font-size="11" text-anchor="middle" fill="#808080">L3-Inferred</text>

  <!-- Legend -->
  <rect x="20" y="440" width="920" height="160" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="40" y="468" font-size="13" font-weight="bold" fill="#333333">Reachability</text>
  <rect x="40" y="478" width="22" height="14" fill="#d5e8d4" stroke="#82b366"/>
  <text x="70" y="490" font-size="12" fill="#333333">Reachable</text>
  <rect x="170" y="478" width="22" height="14" fill="#f8cecc" stroke="#b85450"/>
  <text x="200" y="490" font-size="12" fill="#333333">Unreachable</text>
  <rect x="310" y="478" width="22" height="14" fill="#eeeeee" stroke="#666666"/>
  <text x="340" y="490" font-size="12" fill="#333333">Unknown</text>

  <text x="40" y="522" font-size="13" font-weight="bold" fill="#333333">Link confidence</text>
  <line x1="40" y1="538" x2="90" y2="538" stroke="#2D7600" stroke-width="3"/>
  <text x="98" y="542" font-size="12" fill="#333333">L2-SNMP (verified LLDP/CDP)</text>
  <line x1="380" y1="538" x2="430" y2="538" stroke="#0B7285" stroke-width="2.5"/>
  <text x="438" y="542" font-size="12" fill="#333333">L2-FDB (bridge table)</text>
  <line x1="40" y1="562" x2="90" y2="562" stroke="#B26A00" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="98" y="566" font-size="12" fill="#333333">L2-SNMP-Heuristic (provisional hint)</text>
  <line x1="380" y1="562" x2="430" y2="562" stroke="#808080" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="438" y="566" font-size="12" fill="#333333">L3-Inferred</text>

  <text x="480" y="606" font-size="11" text-anchor="middle" fill="#888888">Example output of Import-Inventory | Export-DrawIO (web-preview rendering; open the .drawio file in diagrams.net for Cisco icons)</text>
</svg>
